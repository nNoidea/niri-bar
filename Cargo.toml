[package]
name = "niri-bar"
version = "0.2.6"
edition = "2021"
rust-version = "1.85"
authors = ["nNoidea"]
description = "A fast, lightweight, standalone Wayland status bar and spatial window taskbar for Niri"
license = "GPL-3.0-or-later"
repository = "https://github.com/nNoidea/niri-bar"

# NOTE: GTK3 is intentional. This bar stays resident at all times, so we
# prefer the lower memory/CPU overhead of GTK3 over GTK4. Do not migrate
# to gtk4 / gtk4-layer-shell without measuring resident RSS first.

[[bin]]
name = "niri-bar"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
async-channel = "2.3"
chrono = "0.4"
freedesktop-desktop-entry = "0.8"
libc = "0.2"
zbus = { version = "5", features = ["tokio"] }
zvariant = "5"
futures-util = "0.3"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[package.metadata.deb]
name = "niri-bar"
maintainer = "nNoidea <https://github.com/nNoidea/niri-bar>"
copyright = "2026 nNoidea"
license-file = ["LICENSE", "4"]
extended-description = """\
A fast, lightweight Wayland status bar and spatial window taskbar built \
specifically for the Niri scrollable-tiling compositor."""
depends = "$auto, libgtk-3-0, libgtk-layer-shell0"
recommends = "wireplumber | pipewire-utils, brightnessctl, bluez"
section = "utils"
priority = "optional"
assets = [
    ["target/release/niri-bar", "usr/bin/niri-bar", "755"],
    ["resources/config.default.toml", "usr/share/niri-bar/config.default.toml", "644"],
    ["resources/style.default.css", "usr/share/niri-bar/style.default.css", "644"],
    ["resources/NerdFont-Regular.ttf", "usr/share/fonts/truetype/niri-bar/NerdFont-Regular.ttf", "644"],
    ["images/icon2.svg", "usr/share/icons/hicolor/scalable/apps/niri-bar.svg", "644"],
    ["README.md", "usr/share/doc/niri-bar/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/niri-bar", dest = "/usr/bin/niri-bar", mode = "755" },
    { source = "resources/config.default.toml", dest = "/usr/share/niri-bar/config.default.toml", mode = "644" },
    { source = "resources/style.default.css", dest = "/usr/share/niri-bar/style.default.css", mode = "644" },
    { source = "resources/NerdFont-Regular.ttf", dest = "/usr/share/fonts/niri-bar/NerdFont-Regular.ttf", mode = "644" },
    { source = "images/icon2.svg", dest = "/usr/share/icons/hicolor/scalable/apps/niri-bar.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/niri-bar/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/niri-bar/LICENSE", mode = "644" },
]
auto-req = "yes"
requires = { "gtk3" = "*", "gtk-layer-shell" = "*" }
recommends = { "pipewire-utils" = "*", "brightnessctl" = "*", "bluez" = "*" }


[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }

# --- 1. Crash & Panic Prevention (Resident Daemon) ---
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"

# --- 2. Concurrency & Async Traps ---
await_holding_lock = "warn"
let_underscore_lock = "deny"
let_underscore_future = "warn"

# --- 3. Memory & Performance Traps ---
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
assigning_clones = "warn"
mem_forget = "warn"
trivially_copy_pass_by_ref = "warn"
needless_collect = "warn"
unnecessary_to_owned = "warn"
box_collection = "warn"
vec_box = "warn"
zero_sized_map_values = "warn"
iter_overeager_cloned = "warn"
large_types_passed_by_value = "warn"
inefficient_to_string = "warn"
fallible_impl_from = "warn"

# --- 4. Logic & Error Hygiene ---
match_wild_err_arm = "warn"
lossy_float_literal = "warn"
exit = "warn"