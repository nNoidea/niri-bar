<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Base Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- Bar Chassis -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323236" />
      <stop offset="100%" stop-color="#242426" />
    </linearGradient>

    <!-- Recessed Tile Well -->
    <linearGradient id="wellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161618" />
      <stop offset="100%" stop-color="#1c1c1e" />
    </linearGradient>

    <!-- Blue Bar & Diagonal Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>

    <!-- Active Dragged App Tile -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>

    <!-- Widgets -->
    <linearGradient id="volGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a" />
      <stop offset="100%" stop-color="#e08500" />
    </linearGradient>

    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30d158" />
      <stop offset="100%" stop-color="#24a143" />
    </linearGradient>

    <linearGradient id="videoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#9a35d1" />
    </linearGradient>

    <linearGradient id="calGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="100%" stop-color="#d7281e" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="barShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="topBarShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. BASE SQUIRCLE -->
  <rect x="40" y="40" width="432" height="432" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#squircleShadow)" />
  <rect x="41" y="41" width="430" height="430" rx="95" ry="95" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- 2. LEFT VERTICAL BAR -->
  <g transform="translate(120, 80)" filter="url(#barShadow)">
    <rect x="0" y="0" width="72" height="352" rx="36" ry="36" fill="url(#chassisGrad)" />
    <rect x="1" y="1" width="70" height="350" rx="35" ry="35" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

    <!-- Slot 1: Pure Empty Space -->

    <!-- Slot 2: Volume Square (52x52, rx=16) -->
    <g transform="translate(10, 150)">
      <rect x="0" y="0" width="52" height="52" rx="16" ry="16" fill="url(#wellGrad)" />
      <g transform="translate(7, 7)">
        <rect x="0" y="0" width="38" height="38" rx="11" ry="11" fill="url(#volGrad)" />
        <g transform="translate(19, 19)">
          <path d="M -6.5 -3.5 L -3 -3.5 L 2.5 -7.5 C 3.6 -8.3 4.8 -7.6 4.8 -6.5 L 4.8 6.5 C 4.8 7.6 3.6 8.3 2.5 7.5 L -3 3.5 L -6.5 3.5 C -7.3 3.5 -8 2.8 -8 2 L -8 -2 C -8 -2.8 -7.3 -3.5 -6.5 -3.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" />
          <path d="M 7.5 -3.5 C 9.8 -1.2 9.8 1.2 7.5 3.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- Slot 3: Date Square (52x52, rx=16) -->
    <g transform="translate(10, 251)">
      <rect x="0" y="0" width="52" height="52" rx="16" ry="16" fill="url(#wellGrad)" />
      <g transform="translate(7, 7)">
        <rect x="0" y="0" width="38" height="38" rx="11" ry="11" fill="#f2f2f7" />
        <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 28 0 C 33.5 0 38 4.5 38 10 L 38 12 L 0 12 Z" fill="url(#calGrad)" />
        <circle cx="10" cy="5" r="1.5" fill="#1c1c1e" />
        <circle cx="28" cy="5" r="1.5" fill="#1c1c1e" />
        <text x="19" y="30" font-family="-apple-system, 'SF Pro Display', 'Inter', monospace" font-size="16" font-weight="800" fill="#1c1c1e" text-anchor="middle">10</text>
      </g>
    </g>
  </g>

  <!-- 3. RIGHT VERTICAL BAR -->
  <g transform="translate(320, 80)" filter="url(#barShadow)">
    <rect x="0" y="0" width="72" height="352" rx="36" ry="36" fill="url(#chassisGrad)" />
    <rect x="1" y="1" width="70" height="350" rx="35" ry="35" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

    <!-- Slot 1: Video App (52x52, rx=16) -->
    <g transform="translate(10, 49)">
      <rect x="0" y="0" width="52" height="52" rx="16" ry="16" fill="url(#wellGrad)" />
      <g transform="translate(7, 7)">
        <rect x="0" y="0" width="38" height="38" rx="11" ry="11" fill="url(#videoGrad)" />
        <polygon points="14,12 27,19 14,26" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
      </g>
    </g>

    <!-- Slot 2: Terminal App (52x52, rx=16) -->
    <g transform="translate(10, 150)">
      <rect x="0" y="0" width="52" height="52" rx="16" ry="16" fill="url(#wellGrad)" />
      <g transform="translate(7, 7)">
        <rect x="0" y="0" width="38" height="38" rx="11" ry="11" fill="url(#termGrad)" />
        <path d="M 11 13 L 17 19 L 11 25" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="20" y1="25" x2="27" y2="25" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
      </g>
    </g>

    <!-- Slot 3: Pure Empty Space -->
  </g>

  <!-- 4. BLUE BAR & DRAGGED TILE ON TOP LAYER -->
  <g filter="url(#topBarShadow)">
    <path d="M 156 155 L 356 357" stroke="url(#ribbonGrad)" stroke-width="52" stroke-linecap="round" />

    <!-- Dragged Blue Square Tile (96x96, rx=26) -->
    <g transform="translate(256, 256) rotate(-14)">
      <g transform="translate(-48, -48)">
        <rect x="0" y="0" width="96" height="96" rx="26" ry="26" fill="url(#tileGrad)" />
        <rect x="1.5" y="1.5" width="93" height="93" rx="24.5" ry="24.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
        <g transform="translate(22, 22)" fill="#ffffff">
          <rect x="0" y="0" width="22" height="22" rx="6.5" ry="6.5" />
          <rect x="30" y="0" width="22" height="22" rx="6.5" ry="6.5" />
          <rect x="0" y="30" width="22" height="22" rx="6.5" ry="6.5" />
          <rect x="30" y="30" width="22" height="22" rx="6.5" ry="6.5" />
        </g>
      </g>
    </g>
  </g>
</svg>