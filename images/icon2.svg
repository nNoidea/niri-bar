<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bar Gradients -->
    <linearGradient id="leftBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e84858" />
      <stop offset="100%" stop-color="#c82e3e" />
    </linearGradient>
    <linearGradient id="rightBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59b38" />
      <stop offset="100%" stop-color="#d86c1e" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323236" />
      <stop offset="100%" stop-color="#242426" />
    </linearGradient>

    <!-- Diagonal Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e84858" /><stop offset="50%" stop-color="#eb6e4a" /><stop offset="100%" stop-color="#f2903c" />
    </linearGradient>

    <!-- Dragged Tile -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e84c5a" /><stop offset="100%" stop-color="#f08c3e" />
    </linearGradient>

    <!-- Widget Gradients -->
    <linearGradient id="volGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a" />
      <stop offset="100%" stop-color="#e08500" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30d158" />
      <stop offset="100%" stop-color="#24a143" />
    </linearGradient>
    <linearGradient id="videoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#9a35d1" />
    </linearGradient>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="100%" stop-color="#d7281e" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="barShadow" x="-25%" y="-20%" width="150%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.40" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="topBarShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- 1. LEFT VERTICAL BAR -->
  <g transform="translate(106, 80)" filter="url(#barShadow)">
    <rect x="0" y="0" width="100" height="352" rx="50" ry="50" fill="url(#leftBarGrad)" />
    <rect x="1" y="1" width="98" height="350" rx="49" ry="49" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

    <!-- Slot 2: Volume Square -->
    <g transform="translate(50, 176) scale(1.2) translate(-32, -32)">
      <rect x="0" y="0" width="64" height="64" rx="18" ry="18" fill="url(#volGrad)" />
      <g transform="translate(29, 32) scale(1.22)">
        <path d="M -11 -6 L -5.5 -6 L 5 -12.5 C 6.8 -13.8 8.5 -12.8 8.5 -10.5 L 8.5 10.5 C 8.5 12.8 6.8 13.8 5 12.5 L -5.5 6 L -11 6 C -12.5 6 -13.5 4.8 -13.5 3.2 L -13.5 -3.2 C -13.5 -4.8 -12.5 -6 -11 -6 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
        <path d="M 14.5 -8 C 21 -2.5 21 2.5 14.5 8" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Slot 3: Date Square -->
    <g transform="translate(50, 277) scale(1.2) translate(-32, -32)">
      <rect x="0" y="0" width="64" height="64" rx="18" ry="18" fill="#f2f2f7" />
      <path d="M 0 18 C 0 8 8 0 18 0 L 46 0 C 56 0 64 8 64 18 L 64 21 C 64 22 63 23 62 23 L 2 23 C 1 23 0 22 0 21 Z" fill="url(#calGrad)" />
      <circle cx="16" cy="11" r="3.5" fill="#1c1c1e" />
      <circle cx="48" cy="11" r="3.5" fill="#1c1c1e" />
      <g stroke="#1c1c1e" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 17 40 L 23 33.5 L 23 53.5" />
        <rect x="31.5" y="33.5" width="18" height="20" rx="9" ry="9" />
      </g>
    </g>
  </g>

  <!-- 2. RIGHT VERTICAL BAR -->
  <g transform="translate(306, 80)" filter="url(#barShadow)">
    <rect x="0" y="0" width="100" height="352" rx="50" ry="50" fill="url(#rightBarGrad)" />
    <rect x="1" y="1" width="98" height="350" rx="49" ry="49" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

    <!-- Slot 1: Video App -->
    <g transform="translate(50, 75) scale(1.2) translate(-32, -32)">
      <rect x="0" y="0" width="64" height="64" rx="18" ry="18" fill="url(#videoGrad)" />
      <polygon points="18.5,15 45.5,32 18.5,49" fill="#ffffff" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />
    </g>

    <!-- Slot 2: Terminal App -->
    <g transform="translate(50, 176) scale(1.2) translate(-32, -32)">
      <rect x="0" y="0" width="64" height="64" rx="18" ry="18" fill="url(#termGrad)" />
      <path d="M 15 18 L 30 32 L 15 46" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="36" y1="46" x2="50" y2="46" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- 3. DIAGONAL RIBBON & DRAGGED TILE -->
  <g filter="url(#topBarShadow)">
    <path d="M 156 155 L 356 357" stroke="url(#ribbonGrad)" stroke-width="72" stroke-linecap="round" />
    <g transform="translate(256, 256) rotate(-14) scale(1.5)">
      <g transform="translate(-53, -53)">
        <rect x="0" y="0" width="106" height="106" rx="29" ry="29" fill="url(#tileGrad)" />
        <rect x="1.5" y="1.5" width="103" height="103" rx="27.5" ry="27.5" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="2.5" />
        <!-- Rounded Pill Eyes Smile Face -->
        <g fill="#ffffff">
          <line x1="37" y1="33" x2="37" y2="47" stroke="#ffffff" stroke-width="14.5" stroke-linecap="round" />
          <line x1="69" y1="33" x2="69" y2="47" stroke="#ffffff" stroke-width="14.5" stroke-linecap="round" />
          <path d="M 33 63 Q 53 86 73 63" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
        </g>
      </g>
    </g>
  </g>
</svg>