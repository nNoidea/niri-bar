name: CI

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-layer-shell-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets --locked -- --test-threads=1
        env:
          GDK_BACKEND: memory

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-layer-shell-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary and package
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1 | tr -d '[:space:]')
          echo "Building niri-bar v${VERSION}..."
          cargo build --release --locked
          mkdir -p dist/package
          cp target/release/niri-bar dist/package/
          cp resources/config.default.toml resources/style.default.css dist/package/
          tar -czvf "dist/niri-bar-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C dist/package .
          cp target/release/niri-bar dist/niri-bar

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niri-bar-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7
